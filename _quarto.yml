project:
  type: website
  output-dir: _site
  pre-render: python scripts/generate_pages.py
  render:
    - "*.qmd"

website:
  title: "Matthew D. Webb"
  site-url: "https://mattdwebb.github.io/"
  description: "Research in applied microeconometrics, causal inference, machine learning for economic measurement, and empirical microeconomics."
  search: false
  navbar:
    background: light
    foreground: dark
    pinned: true
    left:
      - href: research.qmd
        text: Research
      - href: software.qmd
        text: Software
      - href: teaching.qmd
        text: Teaching
      - href: videos.qmd
        text: Videos
      - href: "https://raw.githubusercontent.com/mattdwebb/cv/main/webb_CV.pdf"
        text: CV
      - text: More
        menu:
          - href: conferences.qmd
            text: Conferences
          - href: hockey.qmd
            text: Hockey
    right:
      - href: "https://scholar.google.ca/citations?user=kojy3UAAAAAJ&hl=en"
        text: Scholar
        aria-label: Google Scholar
      - href: "https://github.com/mattdwebb"
        text: GitHub
      - href: "https://youtube.com/@MattWebbEcon"
        text: YouTube
      - href: "mailto:matt.webb@carleton.ca"
        text: Email
  page-footer:
    left: "© Matthew D. Webb"
    right: "Associate Professor of Economics · Carleton University"
  open-graph: true
  twitter-card: false
  page-navigation: false

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    lang: en
